[project]
name = "proj-day"
version = "0.1.0"
description = "Search YouTube playlist transcripts and return timestamped video sources"
readme = "README.md"
authors = [
    { name = "Sunculp Shukla", email = "sunculpshukla@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "groq>=0.30.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.14.0",
    "sentence-transformers>=4.0.0",
    "uvicorn[standard]>=0.30.0",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2025.6.30",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
